name: Android native network-arrow layout — unversioned candidate

on:
  push:
    branches: [feat/release-057-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-layout-candidate:
    if: github.ref == 'refs/heads/feat/release-057-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Run source checks first
        run: |
          python3 diakitw-android/tests/test_android_emulator_workflow.py
          python3 diakitw-android/tests/test_network_ui.py
          python3 diakitw-android/tests/test_speed_compact.py
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android layout probe on portrait and landscape
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: bash diakitw-android/ci/run-android-layout.sh
      - name: Upload native probe evidence only, never an unsigned APK as a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diakitw-android-layout-evidence-${{ github.sha }}
          path: diakitw-android/emulator-evidence
          if-no-files-found: error
          retention-days: 14
