name: Android 1.0.2 signed candidate and native entry

on:
  push:
    branches: [feat/release-102]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-signed-candidate:
    if: github.ref == 'refs/heads/feat/release-102'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Source and offline update tests
        run: |
          python3 -m unittest discover -s diakitw-android/tests -p 'test_*.py'
          bash diakitw-android/ci/run-update-tests.sh
          python3 release/tests/test_unified_102_source.py
          python3 release/tests/test_packaging_102.py
      - name: Build and verify signed release APK
        env:
          DIAKITW_ANDROID_P12_BASE64: ${{ secrets.DIAKITW_ANDROID_P12_BASE64 }}
          DIAKITW_ANDROID_P12_PASSWORD: ${{ secrets.DIAKITW_ANDROID_P12_PASSWORD }}
        run: bash diakitw-android/ci/build-signed-102.sh
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native offline entry flag probe
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: bash diakitw-android/ci/run-android-entry.sh
      - name: Upload verified signed candidate and evidence (not a published release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diakitw-android-1.0.2-signed-${{ github.sha }}
          path: |
            diakitw-android/release-candidate/diakitw-android-1.0.2.apk
            diakitw-android/release-candidate/SHA256SUMS.txt
            diakitw-android/release-candidate/source-commit.txt
            diakitw-android/release-candidate/native-entry-status.txt
          if-no-files-found: error
          retention-days: 14
