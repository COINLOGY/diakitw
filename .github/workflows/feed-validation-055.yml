name: Final 0.5.5 shared feed parsers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parsers:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact shipped 054 and current parsers; no rebuild
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tag v0.5.4
          mkdir -p .ci-scratch
          curl -fLsS --max-time 60 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o .ci-scratch/json.jar
          curl -fLsS --max-time 60 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar.sha256 -o .ci-scratch/json.sha256
          python3 -c 'import pathlib,hashlib; p=pathlib.Path(".ci-scratch"); assert hashlib.sha256((p/"json.jar").read_bytes()).hexdigest()==(p/"json.sha256").read_text().strip()'
          python3 release/check-feed-055.py
