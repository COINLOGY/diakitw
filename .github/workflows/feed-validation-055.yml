name: Final 0.5.5 shared feed parsers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parsers:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact shipped 054 and current parsers; no rebuild
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tag v0.5.4
          mkdir -p .ci-scratch
          curl -fLsS --max-time 60 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o .ci-scratch/json.jar
          python3 -c 'import pathlib,hashlib; assert hashlib.sha256(pathlib.Path(".ci-scratch/json.jar").read_bytes()).hexdigest()=="3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed"'
          python3 release/check-feed-055.py
