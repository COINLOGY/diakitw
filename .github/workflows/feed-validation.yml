name: Shared update feed validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'README.md'
      - 'manifest.json'
      - 'site.js'
      - 'updates/v1.json'
      - 'updates/v2.json'
      - 'release/check-publication-surfaces.py'
      - 'release/check-feed-*'
      - 'release/FeedCheck.java'
      - '.github/workflows/feed-validation.yml'
      - 'release/tests/**'
      - 'diakitw-android/app/src/main/java/app/diakitw/Updates.java'
      - 'diakitw-desktop/app/updates.cjs'
      - 'macdir/Sources/MacdirCore/UpdateChecker.swift'
      - 'ios/Sources/UpdateChecker.swift'
permissions:
  contents: read
jobs:
  parsers:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Same manifest through production parsers
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c "import plistlib; assert plistlib.load(open('macdir/Info.plist', 'rb'))['CFBundleShortVersionString'] == '1.0.3'"; then
            python3 release/tests/test_unified_103_source.py
            python3 release/tests/test_packaging_103.py
            python3 macdir/Tests/test_country_flag_status.py
          elif python3 -c "import plistlib; assert plistlib.load(open('macdir/Info.plist', 'rb'))['CFBundleShortVersionString'] == '1.0.2'"; then
            python3 release/tests/historical_unified_102_source.py
            python3 release/tests/test_packaging_102.py
            python3 macdir/Tests/test_country_flag_status.py
          else
            python3 release/tests/historical_unified_101_source.py
          fi
          python3 release/tests/test_android_signing_generation_feeds.py
          python3 release/tests/test_publication_101.py
          python3 release/tests/test_publication_102.py
          node release/check-feed.cjs
          python3 release/check-publication-surfaces.py
          cmp macdir/Sources/MacdirCore/UpdateChecker.swift ios/Sources/UpdateChecker.swift
          mkdir -p .ci-scratch/java-current
          swiftc macdir/Sources/MacdirCore/UpdateChecker.swift release/check-feed.swift -o .ci-scratch/feed-check
          .ci-scratch/feed-check release/fixtures/v1-0.5.4.json
          swiftc macdir/Sources/MacdirCore/UpdateChecker.swift release/check-feed-056.swift -o .ci-scratch/feed-check-056
          .ci-scratch/feed-check-056 updates/v1.json
          node release/check-feed-056.cjs updates/v1.json
          curl -fLsS --max-time 60 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o .ci-scratch/json.jar
          shasum -a 256 .ci-scratch/json.jar
          javac -cp .ci-scratch/json.jar -d .ci-scratch/java-current diakitw-android/app/src/main/java/app/diakitw/Updates.java release/FeedCheck.java
          java -cp .ci-scratch/json.jar:.ci-scratch/java-current app.diakitw.FeedCheck release/fixtures/v1-0.5.4.json
          java -cp .ci-scratch/json.jar:.ci-scratch/java-current app.diakitw.FeedCheck release/fixtures/v1-0.5.4.json old-fixture
          java -cp .ci-scratch/json.jar:.ci-scratch/java-current app.diakitw.FeedCheck updates/v2.json current-feed
